plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiangqi.h5game'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiangqi.h5game"
        minSdk 26          // Android 8.0+，2026 年可忽略更低版本
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // 签名：通过环境变量注入，绝不写死到仓库里。
    // 只有密钥文件真实存在时才启用正式签名；否则 release 自动回退到 debug 签名（仅本地测试用）。
    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug)
        }
        debug {
            // 默认使用 Android 自动生成的 debug 签名，可直接安装测试
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
